
name: Sancho Systems Status Reporter

'on': workflow_dispatch

permissions:
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Report workflow status to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$CONCLUSION" in
            success) STATUS="[OK] SUCCESS" ;;
            failure) STATUS="[ERROR] FAILED" ;;
            cancelled) STATUS="[CANCELLED]" ;;
            *) STATUS="[INFO] $CONCLUSION" ;;
          esac

          MESSAGE="SANCHO SYSTEMS
          Workflow: $WORKFLOW_NAME
          Status: $STATUS
          Details: $RUN_URL"

          PAYLOAD=$(jq -n --arg content "$MESSAGE" \
            '{content: $content}')

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
