
name: YouTube New Video Notifier

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-notify
  cancel-in-progress: false

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Log trigger time (UTC)
        run: |
          echo "Triggered at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Event: ${{ github.event_name }}"

      - name: Debug YouTube feed entries
        run: |
          curl -L --max-time 20 -s 'https://www.youtube.com/feeds/videos.xml?channel_id=UCtBpEQqDUZqHr8JTeZteebA' | \
            grep -n '<entry>\|<yt:videoId>\|<title>\|<published>' | sed -n '1,80p' || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check YouTube channels and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
        run: node ./src/webhookYoutubeRunner.js

      - name: Commit updated video state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          git commit -m "chore: update last seen video state"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; stopping safely."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Video state successfully pushed."
              exit 0
            fi

            echo "Push failed; will retry if attempts remain."
            git rebase --abort 2>/dev/null || true
          done

          echo "Could not push after 3 attempts."
          exit 1
